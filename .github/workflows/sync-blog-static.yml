name: Sync blog static content

"on":
  push:
    branches: [main]
    paths:
      - 'src/data/posts.jsx'
  workflow_dispatch:

# Necessario perche' il job possa ricommittare index.html sul repo.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rigenera blocco statico blog
        run: node generate-blog-noscript.mjs

      # index.html e' una copia del file sorgente index-XX.html. Lo script
      # rigenera solo index.html, quindi senza questo passo i due divergono
      # e la copia successiva fatta a mano riporta indietro il blocco blog.
      - name: Riallinea il file sorgente index-XX.html
        run: |
          for f in index-*.html; do
            [ -e "$f" ] || continue
            cp index.html "$f"
            echo "riallineato $f"
          done

      - name: Commit e push se qualcosa e' cambiato
        run: |
          if git diff --quiet -- index.html index-*.html; then
            echo "gia' aggiornati, nessun commit necessario."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html index-*.html
            git commit -m "Rigenera blog statico e riallinea il sorgente [automatico]"
            git push
          fi
